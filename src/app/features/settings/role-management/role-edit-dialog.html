<h2 mat-dialog-title>Rolle bearbeiten</h2>

<div mat-dialog-content class="dialog-content">
  <div class="role-user">
    <strong>{{ profile.display_name || profile.username }}</strong>
    <span>&#64;{{ profile.username }}</span>
  </div>

  <div class="role-options" role="radiogroup" aria-label="Rolle">
    @for (role of roles; track role.role) {
      <button
        type="button"
        role="radio"
        class="role-option"
        [attr.data-role]="role.role"
        [class.role-option--selected]="selectedRole() === role.role"
        [attr.aria-checked]="selectedRole() === role.role"
        (click)="selectedRole.set(role.role)"
      >
        <mat-icon aria-hidden="true">{{ role.icon }}</mat-icon>
        <span class="role-option-copy">
          <strong>{{ role.label }}</strong>
          <span>{{ role.description }}</span>
        </span>
        <mat-icon class="role-option-check" aria-hidden="true">
          {{ selectedRole() === role.role ? 'radio_button_checked' : 'radio_button_unchecked' }}
        </mat-icon>
      </button>
    }
  </div>

  @if (errorMessage()) {
    <p class="dialog-error" role="alert">{{ errorMessage() }}</p>
  }
</div>

<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Abbrechen</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="selectedRole() === profile.role || saving()"
    (click)="save()"
  >
    {{ saving() ? 'Speichern ...' : 'Speichern' }}
  </button>
</div>
