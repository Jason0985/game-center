<div class="game-setup-root ui-page-root">
  <section class="ui-hero ui-header-nav hero">
    <a
      class="ui-header-button ui-header-button--start"
      routerLink="/collection"
      matTooltip="Zur Sammlung"
      aria-label="Zur Sammlung zurück"
    >
      <mat-icon aria-hidden="true">chevron_left</mat-icon>
    </a>
    <h1 class="ui-title">Brettspiel <span class="ui-accent">Ranking</span></h1>
    <p class="ui-subtitle">
      Punkte erfassen, automatisch zusammenrechnen und den Spielstand immer im Blick behalten
    </p>
  </section>

  <mat-card class="add-card ui-surface">
    <mat-card-content class="add-content">
      <div class="add-heading">
        <div class="add-icon"><mat-icon aria-hidden="true">person_add</mat-icon></div>
        <div>
          <div class="add-title">Spieler hinzufügen</div>
          <div class="add-hint">Wer sitzt heute mit am Tisch?</div>
        </div>
      </div>
      <div class="top">
        <mat-form-field appearance="outline" class="name-field">
          <mat-label>Name eingeben</mat-label>
          <input matInput [(ngModel)]="name" (keyup.enter)="add()" />
        </mat-form-field>
        <button mat-flat-button color="primary" class="add-button ui-button ui-button--icon-after" (click)="add()">
          <span>Spieler hinzufügen</span>
          <mat-icon aria-hidden="true">add</mat-icon>
        </button>
      </div>
    </mat-card-content>
  </mat-card>

  <div class="player-card-list ui-surface">
    <mat-card *ngFor="let player of players$ | async; let rank = index; trackBy: trackById" class="ui-player-card">
      <div class="ui-player-info">
        <span class="ui-rank-badge">{{ rank + 1 }}</span>
        <div class="player-details">
          <div class="ui-player-name">{{ player.name }}</div>
        </div>
      </div>
      <button mat-mini-fab color="warn" class="remove-player-button" type="button"
        [attr.aria-label]="player.name + ' entfernen'" (click)="removePlayer(player.id)">
        <mat-icon aria-hidden="true">remove</mat-icon>
      </button>
    </mat-card>
  </div>

  <button mat-flat-button color="primary" class="start-button ui-button ui-button--icon-after" (click)="startGame()">
    <span>Spiel starten</span>
    <mat-icon aria-hidden="true">play_arrow</mat-icon>
  </button>
</div>
