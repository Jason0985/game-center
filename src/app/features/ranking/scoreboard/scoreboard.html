<div class="scoreboard-root ui-page-root">
  <section class="ui-hero ui-header-nav hero">
    <a
      class="ui-header-button ui-header-button--start"
      routerLink="/collection"
      matTooltip="Zur Sammlung"
      aria-label="Zur Sammlung zurück"
    >
      <mat-icon aria-hidden="true">chevron_left</mat-icon>
    </a>
    <h1 class="ui-title">Brettspiel <span class="ui-accent">Ranking</span></h1>
    <div class="ui-badge">Runde {{ ((roundCount$ | async) ?? 0) + 1 }}</div>
  </section>

  <div class="player-card-list ui-surface">
    <mat-card *ngFor="let p of players$ | async; let rank = index; trackBy: trackById" class="ui-player-card">
      <div class="mat-card-wrapper">
        <div class="ui-player-info info">
          <div class="player-heading">
            <span class="ui-rank-badge ui-rank-badge--small">{{ rank + 1 }}</span>
            <div class="ui-player-name">{{ p.name }}</div>
          </div>
          <div class="ui-player-score">
            <span class="score-value">{{ p.score }}</span>
            <span class="score-unit">Pkt.</span>
          </div>
        </div>
        <mat-form-field appearance="outline" class="score-field" subscriptSizing="dynamic">
          <mat-label>Score</mat-label>
          <input matInput type="number" min="0" [ngModel]="roundScores[p.id]"
            (ngModelChange)="setRoundScore(p.id, $event)" aria-label="Points for this round" />
        </mat-form-field>
      </div>
    </mat-card>
  </div>

  <div class="footer">
    <button mat-flat-button color="primary" class="ui-button round-button" (click)="nextRound()">
      <mat-icon aria-hidden="true">arrow_forward</mat-icon>
      In die nächste Runde
    </button>

    <button *ngIf="hasCompletedRound" mat-stroked-button class="ui-button danger-button" (click)="endGame()">
      Spiel beenden
      <mat-icon aria-hidden="true">flag</mat-icon>
    </button>
  </div>
</div>
