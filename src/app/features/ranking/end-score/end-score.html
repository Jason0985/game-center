<div class="end-score-root">
  <header class="end-header ui-header-nav">
    <a
      class="ui-header-button ui-header-button--start"
      routerLink="/collection"
      matTooltip="Zur Sammlung"
      aria-label="Zur Sammlung zurück"
    >
      <mat-icon aria-hidden="true">chevron_left</mat-icon>
    </a>
    <h1 class="ui-title">End<span class="ui-accent">punktestand</span></h1>
    <div class="ui-badge">Rundenanzahl {{ (roundCount$ | async) ?? 0 }}</div>
  </header>


  <div class="player-card-list ui-surface">
    <mat-card *ngFor="let player of players$ | async; let rank = index; trackBy: trackById" class="ui-player-card">
      <div class="ui-player-info">
        <div class="ui-rank-badge">{{ rank + 1 }}</div>
        <div class="ui-player-name">{{ player.name }}</div>
      </div>
      <div class="ui-player-score">
        <span class="score-value">{{ player.score }}</span>
        <span class="score-unit">Pkt.</span>
      </div>
    </mat-card>
  </div>

  <button mat-flat-button color="warn" class="new-game-button" (click)="startNewGame()">
    <mat-icon>replay</mat-icon>
    Neues Spiel starten
  </button>
</div>
