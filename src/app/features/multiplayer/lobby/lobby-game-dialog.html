<h2 mat-dialog-title>Spiel wählen</h2>

<div mat-dialog-content class="dialog-content">
  @for (game of games; track game.key) {
    <button
      type="button"
      class="game-tile"
      [class.game-tile--selected]="game.key === data.gameKey"
      [attr.aria-pressed]="game.key === data.gameKey"
      [mat-dialog-close]="game.key"
    >
      <mat-icon class="game-icon" aria-hidden="true">{{ game.icon }}</mat-icon>
      <span class="game-copy">
        <strong>{{ game.name }}</strong>
        <small>{{ game.blurb }}</small>
        <small class="game-players">
          <mat-icon aria-hidden="true">group</mat-icon>
          {{ game.players }}
        </small>
        @if (game.url) {
          <small class="game-players">
            <mat-icon aria-hidden="true">link</mat-icon>
            {{ game.url }}
          </small>
        }
      </span>
      @if (game.key === data.gameKey) {
        <mat-icon class="game-check" aria-hidden="true">check_circle</mat-icon>
      }
    </button>
  }
</div>

<div mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Abbrechen</button>
</div>
