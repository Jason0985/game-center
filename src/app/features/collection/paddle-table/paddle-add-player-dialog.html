<h2 mat-dialog-title>Spieler hinzufügen</h2>

<form mat-dialog-content class="dialog-form" (submit)="$event.preventDefault(); add()">
  <mat-form-field appearance="outline">
    <mat-label>Name</mat-label>
    <input matInput [(ngModel)]="name" name="playerName" autocomplete="off" cdkFocusInitial />
  </mat-form-field>
</form>

<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Abbrechen</button>
  <button mat-flat-button color="primary" type="button" [disabled]="!name.trim()" (click)="add()">
    Hinzufügen
  </button>
</div>
