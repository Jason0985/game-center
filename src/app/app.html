<div class="app-shell">
  <header class="top-bar">
    <span class="top-bar-title">
      <img src="icons/app-icon.svg" alt="" aria-hidden="true" />
      Game Center
    </span>

    <div class="header-actions">
      <button
        mat-icon-button
        class="header-icon-button notification-button"
        routerLink="/notifications"
        [attr.aria-label]="
          notifications.unreadCount()
            ? 'Benachrichtigungen, ' + notifications.unreadCount() + ' neu'
            : 'Benachrichtigungen'
        "
      >
        <mat-icon aria-hidden="true">notifications</mat-icon>
        @if (notifications.unreadCount(); as count) {
          <span class="notification-badge" aria-hidden="true">{{ count > 9 ? '9+' : count }}</span>
        }
      </button>
      <button
        mat-icon-button
        class="header-icon-button"
        routerLink="/settings"
        aria-label="Einstellungen"
      >
        <mat-icon aria-hidden="true">settings</mat-icon>
      </button>
    </div>
  </header>

  <app-toast-host />

  <main>
    <router-outlet></router-outlet>
  </main>

  <nav class="bottom-nav" aria-label="Hauptnavigation">
    <a
      class="bottom-nav-link"
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      aria-label="Home"
    >
      <mat-icon aria-hidden="true">home</mat-icon>
      <span>Home</span>
    </a>
    <a
      class="bottom-nav-link"
      routerLink="/multiplayer"
      routerLinkActive="active"
      aria-label="Multiplayer"
    >
      <mat-icon aria-hidden="true">groups</mat-icon>
      <span>Multiplayer</span>
    </a>
    <a
      class="bottom-nav-link"
      routerLink="/collection"
      routerLinkActive="active"
      aria-label="Sammlung"
    >
      <mat-icon aria-hidden="true">apps</mat-icon>
      <span>Sammlung</span>
    </a>
    <a class="bottom-nav-link" routerLink="/profile" routerLinkActive="active" aria-label="Profil">
      <mat-icon aria-hidden="true">person</mat-icon>
      <span>Profil</span>
    </a>
  </nav>
</div>
