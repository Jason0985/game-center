<div class="app-shell">
  <header class="top-bar">
    <a class="top-bar-title" routerLink="/" aria-label="Game Center, zur Startseite">
      <img src="icons/app-icon.svg" alt="" aria-hidden="true" />
      Game Center
    </a>

    <div class="header-actions">
      <!-- Einstellungen nur auf der Profilseite, sonst nur die Benachrichtigungen -->
      @if (onProfile()) {
        <a class="header-icon-button" routerLink="/settings" aria-label="Einstellungen">
          <mat-icon aria-hidden="true">settings</mat-icon>
        </a>
      }
      <a
        class="header-icon-button"
        routerLink="/notifications"
        routerLinkActive="header-icon-button--active"
        [attr.aria-label]="
          notifications.unreadCount()
            ? 'Benachrichtigungen, ' + notifications.unreadCount() + ' neu'
            : 'Benachrichtigungen'
        "
      >
        <mat-icon aria-hidden="true">notifications</mat-icon>
        @if (notifications.unreadCount(); as count) {
          <span class="notification-badge" aria-hidden="true">{{ count > 9 ? '9+' : count }}</span>
        }
      </a>
    </div>
  </header>

  <app-toast-host />

  <main>
    <router-outlet></router-outlet>
  </main>

  <nav class="bottom-nav" aria-label="Hauptnavigation">
    <a
      class="bottom-nav-link"
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <mat-icon aria-hidden="true">home</mat-icon>
      <span>Home</span>
    </a>
    <!-- Für alle: Ohne Konto tritt man dort als Gast mit dem Lobby-Code bei -->
    <a
      class="bottom-nav-link"
      routerLink="/multiplayer"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      <mat-icon aria-hidden="true">groups</mat-icon>
      <span>Multiplayer</span>
    </a>
    <a
      class="bottom-nav-link"
      routerLink="/collection"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      <mat-icon aria-hidden="true">apps</mat-icon>
      <span>Sammlung</span>
    </a>
    <a
      class="bottom-nav-link"
      routerLink="/profile"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      <mat-icon aria-hidden="true">person</mat-icon>
      <span>Profil</span>
    </a>
  </nav>
</div>
