<div class="app-shell">
  <header class="top-bar">
    <span class="top-bar-title">
      <img src="game-center-logo.png" alt="" aria-hidden="true" />
      Game Center
    </span>

    <div class="header-actions">
      <button
        mat-icon-button
        class="header-icon-button notification-button"
        routerLink="/notifications"
        aria-label="Benachrichtigungen"
      >
        <mat-icon aria-hidden="true">notifications</mat-icon>
        <span class="notification-dot"></span>
      </button>
      <button
        mat-icon-button
        class="header-icon-button"
        routerLink="/settings"
        aria-label="Einstellungen"
      >
        <mat-icon aria-hidden="true">settings</mat-icon>
      </button>
    </div>
  </header>

  <main>
    <router-outlet></router-outlet>
  </main>

  <nav class="bottom-nav" aria-label="Hauptnavigation">
    <a
      class="bottom-nav-link"
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      aria-label="Home"
    >
      <mat-icon aria-hidden="true">home</mat-icon>
      <span>Home</span>
    </a>
    <a class="bottom-nav-link" routerLink="/ranking" routerLinkActive="active" aria-label="Ranking">
      <mat-icon aria-hidden="true">leaderboard</mat-icon>
      <span>Ranking</span>
    </a>
    <a
      class="bottom-nav-link"
      routerLink="/collection"
      routerLinkActive="active"
      aria-label="Sammlung"
    >
      <mat-icon aria-hidden="true">apps</mat-icon>
      <span>Sammlung</span>
    </a>
    <a class="bottom-nav-link" routerLink="/profile" routerLinkActive="active" aria-label="Profil">
      <mat-icon aria-hidden="true">person</mat-icon>
      <span>Profil</span>
    </a>
  </nav>
</div>
