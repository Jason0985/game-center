<h2 mat-dialog-title>
  @if (data.icon) {
    <mat-icon aria-hidden="true">{{ data.icon }}</mat-icon>
  }
  {{ data.title }}
</h2>

<mat-dialog-content>{{ data.message }}</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Abbrechen</button>
  <button mat-flat-button class="confirm-button" type="button" (click)="confirm()">
    {{ data.confirmLabel ?? 'Beenden' }}
  </button>
</mat-dialog-actions>
