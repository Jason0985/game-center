<!doctype html>
<html lang="en">
  <head>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Game Center" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta charset="utf-8" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0f1115" />
    <title>Game Center</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Gespeichertes Farbschema vor dem ersten Rendern setzen (kein Aufblitzen)
      try {
        var theme = localStorage.getItem('game-center-theme');
        if (theme === 'graphite' || theme === 'light') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
    </script>
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
      rel="stylesheet"
    />
    <!-- Gefüllte, abgerundete Symbole für die Spieltische (Flip 7, Skip-Bo). Nur diese Symbole
         (alphabetisch); ein neues Symbol hier ergänzen, sonst erscheint sein Name als Text -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&icon_names=ac_unit,add,arrow_back,auto_awesome,block,close,delete_sweep,emoji_events,event_seat,expand_more,favorite,filter_3,group,history,hourglass_bottom,layers,lock,logout,meeting_room,menu_book,more_vert,move_to_inbox,pan_tool,play_arrow,refresh,shuffle,skip_next,sports_esports,star,stop_circle,style&display=block"
      rel="stylesheet"
    />
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
