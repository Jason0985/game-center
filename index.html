<!doctype html>
<html lang="de">
  <head>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-title" content="Game Center"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <meta charset="utf-8"/>
    <link rel="manifest" href="manifest.webmanifest"/>
    <meta name="theme-color" content="#1c1c1e"/>
    <title>Game Center</title>
    <base href="/game-center/"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script>
      // Gespeichertes Farbschema vor dem ersten Rendern setzen (kein Aufblitzen)
      try {
        var theme = localStorage.getItem('game-center-theme');
        var light =
          theme === 'light' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
        if (light) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
      // Kommt evtl. vor dem Start von Angular; PwaService übernimmt es dann
      addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.earlyInstallPrompt = event;
      });
    </script>
    <link rel="icon" href="favicon.ico" sizes="48x48"/>
    <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png"/>
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png"/>
    <!-- Icon-Schriften liegen in public/fonts, damit keine Daten an Google gehen.
         Neues Symbol für die Spieltische: in scripts/update-icon-fonts.mjs ergänzen -->
    <link rel="stylesheet" href="fonts/icons.css"/>
  <link rel="stylesheet" href="/game-center/styles-MKSLSYWM.css"></head>

  <body>
    <app-root></app-root>
  <script src="/game-center/main-H3FJWAIE.js" type="module"></script></body>
</html>
